    const createIcon = (name) => ({ className = "w-4 h-4", ...props }) => {

      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('class', className);
          ref.current.innerHTML = '';
          ref.current.appendChild(svg);
        }

      return <span ref={ref} className="inline-flex items-center justify-center" {...props} />;
    };

// COMPONENTE DE PARTÍCULAS DE VENTO EM CANVAS (FUNDO ATMOSFÉRICO)
// ============================================================================
const WindCanvasBackground = ({ speedMultiplier = 1, warmSunset = false }) => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animationFrameId;
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const handleResize = () => {
      if (!canvas) return;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', handleResize);

    const particleCount = Math.min(75, Math.floor(width / 22));
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      length: 40 + Math.random() * 110,
      baseSpeed: 1.2 + Math.random() * 2.5,
      opacity: 0.08 + Math.random() * 0.22,
      amplitude: 4 + Math.random() * 10,
      freq: 0.004 + Math.random() * 0.006,
      phase: Math.random() * Math.PI * 2,
    }));

    let time = 0;
    const render = () => {
      time += 1;
      ctx.clearRect(0, 0, width, height);

      particles.forEach((p) => {
        p.x += p.baseSpeed * speedMultiplier;
        if (p.x - p.length > width) {
          p.x = -p.length;
          p.y = Math.random() * height;
        }

        ctx.beginPath();
        const grad = ctx.createLinearGradient(p.x - p.length, p.y, p.x, p.y);
        const colorRGB = warmSunset ? '251, 191, 36' : '66, 217, 245';
        grad.addColorStop(0, `rgba(${colorRGB}, 0)`);
        grad.addColorStop(0.5, `rgba(${colorRGB}, ${p.opacity})`);
        grad.addColorStop(1, `rgba(${colorRGB}, 0)`);

        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;

        const segments = 10;
        for (let i = 0; i <= segments; i++) {
          const px = p.x - p.length + (p.length * i) / segments;
          const py = p.y + Math.sin(px * p.freq + p.phase + time * 0.02) * p.amplitude;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });

      animationFrameId = requestAnimationFrame(render);
    };

    render();
    return () => {
      cancelAnimationFrame(animationFrameId);
      window.removeEventListener('resize', handleResize);
    };
  }, [speedMultiplier, warmSunset]);

  return (
    <canvas
      ref={canvasRef}
      className="fixed inset-0 pointer-events-none z-0 opacity-75"
    />
  );
};

// ============================================================================
// COMPONENTE VETORIAL DE AEROGERADOR ANIMADO REUTILIZÁVEL
// ============================================================================
const AnimatedTurbineSVG = ({
  x = 100,
  y = 120,
  scale = 1,
  rpm = 14,
  bladeLengthFactor = 1,
  glowColor = '#42D9F5',
  showAirflow = false,
}) => {
  const duration = rpm > 0.1 ? `${Math.max(0.55, 60 / rpm)}s` : '0s';
  const isSpinning = rpm > 0.1;

  return (
    <g transform={`translate(${x}, ${y}) scale(${scale})`}>
      {/* Base e Torre */}
      <ellipse cx="0" cy="145" rx="22" ry="4" fill="rgba(66,217,245,0.18)" />
      <polygon
        points="-7,145 7,145 3.5,0 -3.5,0"
        fill="url(#towerGrad)"
        stroke="rgba(245,248,252,0.25)"
        strokeWidth="0.6"
      />
      {/* Nacele */}
      <rect
        x="-9"
        y="-7"
        width="22"
        height="11"
        rx="4"
        fill="#E2E8F0"
        stroke="#42D9F5"
        strokeWidth="0.8"
      />
      {/* Conjunto Rotativo (Cubo + Pás) */}
      <g transform="translate(-8, -1.5)">
        <g
          style={{
            transformOrigin: '0px 0px',
            animation: isSpinning ? `spinTurbine ${duration} linear infinite` : 'none',
          }}
        >
          {[0, 120, 240].map((angle) => (
            <g key={angle} transform={`rotate(${angle}) scale(1, ${bladeLengthFactor})`}>
              <path
                d="M 0,0 C 3,-18 4.5,-55 0.8,-95 C 0,-98 -1.5,-97 -1.5,-93 C -2.5,-55 -2,-18 0,0 Z"
                fill="url(#bladeGrad)"
                stroke="rgba(255,255,255,0.5)"
                strokeWidth="0.5"
              />
            </g>
          ))}
        </g>
        {/* Cubo (Spinner) */}
        <circle cx="0" cy="0" r="5.5" fill="#F8FAFC" stroke={glowColor} strokeWidth="1.5" />
        <circle cx="0" cy="0" r="2" fill={glowColor} />
      </g>
      {showAirflow && isSpinning && (
        <g opacity="0.55">
          <line x1="-65" y1="-35" x2="35" y2="-42" stroke={glowColor} strokeWidth="1.2" strokeDasharray="6 6" />
          <line x1="-70" y1="25" x2="35" y2="32" stroke={glowColor} strokeWidth="1.2" strokeDasharray="6 6" />
        </g>
      )}
    </g>
  );
};

          >
            <span>EXPLORAR A APRESENTAÇÃO</span>
            <ArrowRight className="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1.5" />
          </button>
        </div>
      </div>

      {/* Cenário Panorâmico com Paralaxe e Aerogeradores */}
      <div
        className="relative z-10 w-full max-w-6xl mx-auto h-44 sm:h-56 md:h-64 pointer-events-none transition-transform duration-200 ease-out"
        style={{
          transform: `translate(${mouseOffset.x * 0.5}px, ${mouseOffset.y * 0.35}px)`,
        }}
      >
        <svg viewBox="0 0 1200 280" className="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#0D2847" />
              <stop offset="100%" stopColor="#071426" />

            </linearGradient>
          </defs>

          {/* Montanhas de fundo */}
          <path
            d="M-100,280 L-100,190 Q200,120 480,185 T1050,165 L1300,195 L1300,280 Z"
            fill="url(#hillBack)"
          />
          {/* Aerogeradores em segundo plano */}
          <AnimatedTurbineSVG x={210} y={70} scale={0.58} rpm={11} />
          <AnimatedTurbineSVG x={485} y={85} scale={0.52} rpm={13} />

            d="M-100,280 L-100,225 Q320,175 680,220 T1300,205 L1300,280 Z"
            fill="url(#hillFront)"
          />
          {/* Aerogeradores em primeiro plano */}
          <AnimatedTurbineSVG x={340} y={65} scale={0.95} rpm={15} />
          <AnimatedTurbineSVG x={675} y={75} scale={0.88} rpm={14} />
          <AnimatedTurbineSVG x={945} y={68} scale={0.92} rpm={16} />
        </svg>

    </div>
  );
};

// ============================================================================
// SLIDE 03 — A FÍSICA POR TRÁS DO VENTO
// ============================================================================
const Slide03Physics = () => {
  const [testWindSpeed, setTestWindSpeed] = useState(10);

  // Dados da curva cúbica P = 0.5 * rho * A * v^3 (para rho=1.225 kg/m³, R=40m -> A ≈ 5026.5 m²)
  const cubicChartData = useMemo(() => {
    const rho = 1.225;
    const area = Math.PI * 40 * 40;
    const points = [];
    for (let v = 0; v <= 20; v += 2) {
      const powerKW = (0.5 * rho * area * Math.pow(v, 3)) / 1000;
      points.push({
        v,
        potenciaKW: Math.round(powerKW),
      });
    }
    return points;
  }, []);

  const currentDemoPowerKW = useMemo(() => {
    const rho = 1.225;
    const area = Math.PI * 40 * 40;
    return Math.round((0.5 * rho * area * Math.pow(testWindSpeed, 3)) / 1000);
  }, [testWindSpeed]);

  return (
    <div className="w-full h-full flex flex-col justify-center px-5 md:px-14 pt-16 pb-14 max-w-7xl mx-auto">
      <div className="mb-3">
        <span className="text-xs font-bold tracking-widest uppercase text-[#42D9F5]">
          03 • Mecânica dos Fluidos e Energia
        </span>
        <h2 className="text-2xl sm:text-4xl font-bold text-[#F5F8FC] mt-0.5">
          A Física por Trás do Vento
        </h2>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
        {/* Coluna Esquerda: Fórmulas e Lei Cúbica */}
        <div className="lg:col-span-6 flex flex-col justify-between space-y-3">
          {/* Card 1: Energia Cinética */}
          <div className="p-4 rounded-2xl bg-[#0B1D36]/80 border border-white/10 backdrop-blur-md">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <h3 className="text-base sm:text-lg font-bold text-[#F5F8FC]">
                1. Energia Cinética do Ar
              </h3>
              <div className="px-3.5 py-1.5 rounded-lg bg-[#071426] border border-[#42D9F5]/40 font-mono text-base sm:text-lg font-bold text-[#42D9F5]">
                E<sub>c</sub> = (m · v²) / 2
              </div>
            </div>
            <p className="text-xs sm:text-sm text-[#A7B7C9] mb-2">
              O vento é ar em movimento. Como possui massa e velocidade, transporta energia cinética:
            </p>
            <div className="grid grid-cols-3 gap-2 text-xs">
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#42D9F5]">E<sub>c</sub></strong>: Energia cinética (J)
              </div>
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#42D9F5]">m</strong>: Massa do ar (kg)
              </div>
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#42D9F5]">v</strong>: Velocidade (m/s)
              </div>
            </div>
          </div>

          {/* Card 2: Potência do Vento */}
          <div className="p-4 rounded-2xl bg-[#0B1D36]/80 border border-white/10 backdrop-blur-md">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <h3 className="text-base sm:text-lg font-bold text-[#F5F8FC]">
                2. Potência Disponível no Vento
              </h3>
              <div className="px-3.5 py-1.5 rounded-lg bg-[#071426] border border-[#53D68A]/50 font-mono text-base sm:text-lg font-bold text-[#53D68A]">
                P = ½ · ρ · A · v³
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs mt-2">
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#53D68A]">P</strong>: Potência (W)
              </div>
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#53D68A]">ρ</strong>: Densidade (kg/m³)
              </div>
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#53D68A]">A</strong>: Área varrida (m²)
              </div>
              <div className="p-2 rounded-lg bg-white/5">
                <strong className="text-[#53D68A]">v</strong>: Velocidade (m/s)
              </div>
            </div>
          </div>

          {/* Destaque Científico Lei Cúbica */}
          <div className="p-4 rounded-2xl bg-gradient-to-r from-[#1479D4]/25 to-[#53D68A]/15 border border-[#42D9F5]/40">
            <div className="flex items-start gap-3">
              <TrendingUp className="w-6 h-6 text-[#42D9F5] shrink-0 mt-0.5" />
              <p className="text-xs sm:text-sm text-[#F5F8FC] leading-relaxed">
                <strong className="text-[#42D9F5]">Lei Cúbica da Potência Eólica: </strong>
                “A potência disponível no vento aumenta com o cubo da velocidade. Isso significa que, se a velocidade do vento dobrar (2v), a potência disponível será <span className="text-[#53D68A] font-bold">oito vezes maior (2³ = 8)</span>, considerando as demais condições constantes.”
              </p>
            </div>
          </div>
        </div>

        {/* Coluna Direita: Demonstração Animada + Gráfico Interativo */}
        <div className="lg:col-span-6 flex flex-col justify-between bg-[#0B1D36]/80 border border-white/10 rounded-2xl p-4 sm:p-5 backdrop-blur-md">
          {/* Seletor interativo de velocidade */}
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 className="text-sm sm:text-base font-bold text-[#F5F8FC]">
                Relação Cúbica: Velocidade vs. Potência
              </h3>
              <p className="text-xs text-[#A7B7C9]">
                Referência ilustrativa: R = 40 m (A ≈ 5.027 m²), ρ = 1,225 kg/m³
              </p>
            </div>
            <div className="flex items-center gap-1.5 bg-[#071426] p-1 rounded-xl border border-white/10">
              {[5, 10, 15, 20].map((v) => (
                <button
                  key={v}
                  onClick={() => setTestWindSpeed(v)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                    testWindSpeed === v
                      ? 'bg-[#42D9F5] text-[#071426]'
                      : 'text-[#A7B7C9] hover:text-white'
                  }`}
                >
                  {v} m/s
                </button>
              ))}
            </div>
          </div>

          {/* Mini visualização animada + métricas */}
          <div className="grid grid-cols-12 gap-3 items-center bg-[#071426]/80 rounded-xl p-3 border border-white/10 mb-3">
            <div className="col-span-5 h-28 relative overflow-hidden rounded-lg bg-[#0A1D36]">
              <svg viewBox="0 0 180 150" className="w-full h-full">
                <AnimatedTurbineSVG
                  x={105}
                  y={52}
                  scale={0.62}
                  rpm={testWindSpeed * 1.4}
                  showAirflow={true}
                />
              </svg>
            </div>
            <div className="col-span-7 space-y-1.5">
              <div className="text-xs text-[#A7B7C9]">
                Velocidade selecionada: <strong className="text-[#42D9F5]">{testWindSpeed} m/s</strong>
              </div>
              <div className="text-lg sm:text-2xl font-extrabold text-[#53D68A]">
                {currentDemoPowerKW.toLocaleString('pt-BR')} kW
              </div>
              <div className="text-[11px] text-[#A7B7C9]">
                {testWindSpeed === 10 && 'Dobro de 5 m/s → Potência 8× maior (3.083 kW vs 385 kW)!'}
                {testWindSpeed === 5 && 'Vento moderado: base de referência (385 kW).'}
                {testWindSpeed === 15 && 'Triplo de 5 m/s → Potência 27× maior (10.405 kW)!'}
                {testWindSpeed === 20 && 'Quádruplo de 5 m/s → Potência 64× maior (24.664 kW)!'}
              </div>
            </div>
          </div>

          {/* Gráfico Recharts */}
          <div className="w-full h-44 sm:h-48">
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={cubicChartData} margin={{ top: 10, right: 16, left: 0, bottom: 0 }}>
                <defs>
                  <linearGradient id="cubicFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor="#42D9F5" stopOpacity={0.45} />
                    <stop offset="95%" stopColor="#42D9F5" stopOpacity={0.02} />
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.08)" />
                <XAxis
                  dataKey="v"
                  stroke="#A7B7C9"
                  tick={{ fontSize: 11 }}
                  unit=" m/s"
                />
                <YAxis
                  stroke="#A7B7C9"
                  tick={{ fontSize: 11 }}
                  tickFormatter={(val) => `${(val / 1000).toFixed(0)}MW`}
                />
                <RechartsTooltip
                  contentStyle={{
                    backgroundColor: '#071426',
                    borderColor: '#42D9F5',
                    borderRadius: '10px',
                    fontSize: '12px',
                    color: '#F5F8FC',
                  }}
                  formatter={(value) => [`${Number(value).toLocaleString('pt-BR')} kW`, 'Potência do Vento']}
                  labelFormatter={(label) => `Velocidade: ${label} m/s`}
                />
                <Area
                  type="monotone"
                  dataKey="potenciaKW"
                  stroke="#42D9F5"
                  strokeWidth={2.5}
                  fill="url(#cubicFill)"
                />
                <ReferenceDot
                  x={testWindSpeed}
                  y={currentDemoPowerKW}
                  r={6}
                  fill="#53D68A"
                  stroke="#F5F8FC"
                  strokeWidth={2}
                />
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );
};

// ============================================================================
// SLIDE 04 — COMO FUNCIONA UMA USINA EÓLICA? (7 ETAPAS + INDUÇÃO DE FARADAY)
// ============================================================================
const HOW_IT_WORKS_STEPS = [
  {
    step: 1,
    node: 'VENTO → PÁS',
    title: 'ETAPA 1 — O Vento Atinge as Pás',
    subtitle: 'Aerodinâmica e Força de Sustentação',
    content:
      'As pás possuem perfil aerodinâmico semelhante ao de asas de avião (aerofólio). Quando o fluxo de ar atravessa a pá, a curvatura superior acelera o ar, reduzindo a pressão estática (Princípio de Bernoulli e variação de quantidade de movimento). Essa diferença de pressão gera uma força resultante perpendicular ao vento relativo — a sustentação — que produz torque e inicia o giro.',
    highlight: 'Conversão: Energia Cinética Translacional → Força Aerodinâmica (Torque)',
  },
  {
    step: 2,
    node: 'ROTOR',
    title: 'ETAPA 2 — O Rotor Começa a Girar',
    subtitle: 'Energia Mecânica de Rotação',
    content:
      'O rotor é o conjunto formado pelas três pás fixadas ao cubo central (hub). Sob a ação contínua do torque aerodinâmico, o rotor gira tipicamente entre 10 e 20 rotações por minuto (rpm) em turbinas de grande porte, convertendo a energia cinética do vento em energia mecânica de rotação.',
    highlight: 'Conversão: Torque Aerodinâmico → Energia Mecânica Rotacional',
  },
  {
    step: 3,
    node: 'EIXO',
    title: 'ETAPA 3 — O Movimento é Transmitido ao Eixo',
    subtitle: 'Eixo Principal de Baixa Rotação',
    content:
      'O cubo do rotor é acoplado diretamente ao eixo principal (eixo de baixa velocidade). Este eixo robusto de aço forjado transmite toda a potência mecânica rotacional do exterior para o interior da nacele, suportando elevados esforços de torção e flexão.',
    highlight: 'Função: Transmissão mecânica de alto torque do rotor para o trem de força',
  },
  {
    step: 4,
    node: 'MULTIPLICADORA',
    title: 'ETAPA 4 — A Caixa Multiplicadora',
    subtitle: 'Adequação de Rotação (ou Acionamento Direto)',
    content:
      'Geradores convencionais necessitam de altas rotações (cerca de 1.000 a 1.800 rpm) para gerar eletricidade na frequência da rede. A caixa multiplicadora (engrenagens planetárias) eleva a rotação em até 100 vezes. Nota: Turbinas modernas Direct Drive (acionamento direto) dispensam a caixa multiplicadora utilizando geradores multipolos de ímãs permanentes.',
    highlight: 'Relação típica: ~15 rpm no eixo lento → ~1.500 rpm no eixo rápido',
  },
  {
    step: 5,
    node: 'GERADOR',
    title: 'ETAPA 5 — O Gerador Elétrico (Lei de Faraday)',
    subtitle: 'Indução Eletromagnética',
    content:
      'No gerador, a energia mecânica gira um rotor magnético no interior de bobinas de cobre (estator). Segundo a Lei da Indução Eletromagnética de Faraday-Lenz, a variação do fluxo magnético através de um circuito fechado induz uma força eletromotriz (tensão) e corrente elétrica alternada.',
    formula: 'ε = -N · (ΔΦ / Δt)',
    formulaVars: [
      'ε: força eletromotriz induzida (V)',
      'N: número de espiras da bobina',
      'ΔΦ: variação do fluxo magnético (Wb)',
      'Δt: intervalo de tempo (s)',
    ],
    highlight: 'Conversão Principal: Energia Mecânica → Energia Elétrica',
  },
  {
    step: 6,
    node: 'TRANSFORMADOR',
    title: 'ETAPA 6 — Transformador e Subestação',
    subtitle: 'Elevação de Tensão e Redução de Perdas Joule',
    content:
      'A eletricidade sai do gerador em baixa/média tensão (ex: 690 V). Um transformador eleva a tensão para níveis de média tensão (34,5 kV) e, na subestação do parque, para alta tensão (138 kV a 500 kV). Para uma mesma potência (P = U·I), elevar a tensão reduz a corrente (I), minimizando drasticamente as perdas térmicas por Efeito Joule (P_dissipada = R · I²).',
    highlight: 'Física Elétrica: Maior tensão (U) → Menor corrente (I) → Menores perdas (R·I²)',
  },
  {
    step: 7,
    node: 'REDE → RESIDÊNCIAS',
    title: 'ETAPA 7 — Distribuição de Energia',
    subtitle: 'Do Sistema Interligado até o Consumo Final',
    content:
      'A energia percorre as linhas de transmissão de alta tensão até subestações abaixadoras próximas aos centros urbanos, onde é reduzida para a rede de distribuição (13,8 kV) e, finalmente, pelos transformadores dos postes para 127 V ou 220 V, alimentando residências, escolas e indústrias.',
    highlight: 'Entrega Final: Eletricidade limpa pronta para uso imediato',
  },
];

const FLOWCHART_CHAIN = [
  'VENTO',
  'PÁS',
  'ROTOR',
  'EIXO',
  'GERADOR',
  'TRANSFORMADOR',
  'REDE ELÉTRICA',
  'RESIDÊNCIAS',
];

const Slide04HowItWorks = () => {
  const [activeStepIdx, setActiveStepIdx] = useState(0);
  const current = HOW_IT_WORKS_STEPS[activeStepIdx];

  return (
    <div className="w-full h-full flex flex-col justify-center px-5 md:px-14 pt-16 pb-14 max-w-7xl mx-auto">
      <div className="mb-3">
        <span className="text-xs font-bold tracking-widest uppercase text-[#42D9F5]">
          04 • Cadeia de Conversão Energética
        </span>
        <h2 className="text-2xl sm:text-4xl font-bold text-[#F5F8FC] mt-0.5">
          Como Funciona uma Usina Eólica?
        </h2>
      </div>

      {/* Fluxograma Animado Completo */}
      <div className="p-3 rounded-2xl bg-[#0B1D36]/80 border border-white/10 backdrop-blur-md mb-4 overflow-x-auto">
        <div className="flex items-center justify-between min-w-[680px] gap-1">
          {FLOWCHART_CHAIN.map((item, idx) => {
            const isHighlighted =
              idx === activeStepIdx || (activeStepIdx === 6 && idx >= 6);
            return (
              <React.Fragment key={item}>
                <button
                  onClick={() => setActiveStepIdx(Math.min(idx, 6))}
                  className={`px-2.5 py-1.5 rounded-lg text-[11px] font-bold tracking-wide transition-all cursor-pointer border ${
                    isHighlighted
                      ? 'bg-[#42D9F5] text-[#071426] border-[#42D9F5] shadow-[0_0_15px_rgba(66,217,245,0.6)] scale-105'
                      : 'bg-[#071426]/80 text-[#A7B7C9] border-white/10 hover:text-white'
                  }`}
                >
                  {item}
                </button>
                {idx < FLOWCHART_CHAIN.length - 1 && (
                  <ArrowRight
                    className={`w-4 h-4 shrink-0 ${
                      idx < activeStepIdx ? 'text-[#53D68A]' : 'text-[#42D9F5]/50'
                    }`}
                  />
                )}
              </React.Fragment>
            );
          })}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
        {/* Seletor Lateral das 7 Etapas */}
        <div className="lg:col-span-4 flex flex-col gap-1.5">
          {HOW_IT_WORKS_STEPS.map((st, idx) => {
            const active = idx === activeStepIdx;
            return (
              <button
                key={st.step}
                onClick={() => setActiveStepIdx(idx)}
                className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-left transition-all cursor-pointer border ${
                  active
                    ? 'bg-gradient-to-r from-[#1479D4] to-[#0E5AA7] text-white border-[#42D9F5] shadow-md'
                    : 'bg-[#0B1D36]/65 text-[#A7B7C9] border-white/10 hover:bg-[#0B1D36] hover:text-white'
                }`}
              >
                <div className="flex items-center gap-2.5">
                  <span
                    className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-extrabold ${
                      active ? 'bg-[#42D9F5] text-[#071426]' : 'bg-white/10 text-[#42D9F5]'
                    }`}
                  >
                    {st.step}
                  </span>
                  <span className="text-xs sm:text-sm font-semibold truncate">
                    {st.title.replace(`ETAPA ${st.step} — `, '')}
                  </span>
                </div>
                <ChevronRight className={`w-4 h-4 ${active ? 'text-white' : 'opacity-40'}`} />
              </button>
            );
          })}
        </div>

        {/* Painel Detalhado + Ilustração Esquemática Animada */}
        <div className="lg:col-span-8 flex flex-col justify-between bg-[#0B1D36]/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md">
          <div>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <span className="px-3 py-1 rounded-full text-xs font-bold bg-[#42D9F5]/15 text-[#42D9F5] border border-[#42D9F5]/30">
                Passo {current.step} de 7 • {current.subtitle}
              </span>
              <div className="flex gap-2">
                <button
                  onClick={() => setActiveStepIdx((p) => Math.max(0, p - 1))}
                  disabled={activeStepIdx === 0}
                  className="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 disabled:opacity-30 text-xs text-white cursor-pointer"
                >
                  ← Anterior
                </button>
                <button
                  onClick={() => setActiveStepIdx((p) => Math.min(6, p + 1))}
                  disabled={activeStepIdx === 6}
                  className="px-2.5 py-1 rounded-lg bg-[#1479D4] hover:bg-[#1B88EB] disabled:opacity-30 text-xs text-white font-semibold cursor-pointer"
                >
                  Próxima Etapa →
                </button>
              </div>
            </div>

            <h3 className="text-xl sm:text-2xl font-bold text-[#F5F8FC] mb-2">
              {current.title}

            <p className="text-xs sm:text-sm md:text-base text-[#F5F8FC]/90 leading-relaxed mb-3">
              {current.content}
            </p>

            {/* Fórmula de Faraday exibida na Etapa 5 */}
            {current.formula && (
              <div className="p-3.5 rounded-xl bg-[#071426] border border-[#42D9F5]/45 mb-3">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div className="text-xs uppercase tracking-wider text-[#42D9F5] font-bold">

// SLIDE 06 — SIMULADOR INTERATIVO DE UMA USINA EÓLICA
// ============================================================================
const Slide06Simulator = () => {
  // Parâmetros controláveis pelo usuário
  const [windSpeed, setWindSpeed] = useState(11); // 0 a 30 m/s
  const [bladeLength, setBladeLength] = useState(50); // 10 a 80 m
  const [airDensity, setAirDensity] = useState(1.225); // 0.9 a 1.3 kg/m³
  const [cp, setCp] = useState(0.42); // Coeficiente de potência (máx Betz 0.593)
  const [globalEfficiency, setGlobalEfficiency] = useState(88); // Eficiência eletromecânica η (%)
  const [isRunning, setIsRunning] = useState(true);

  // Parâmetros operacionais ilustrativos
  const CUT_IN_SPEED = 3; // m/s
  const RATED_SPEED = 12; // m/s
  const CUT_OUT_SPEED = 25; // m/s

  const handleReset = () => {
    setWindSpeed(11);
    setBladeLength(50);
    setAirDensity(1.225);
    setCp(0.42);
    setGlobalEfficiency(88);
    setIsRunning(true);
  };

  // Cálculos físicos em tempo real
  const physics = useMemo(() => {
    const area = Math.PI * Math.pow(bladeLength, 2); // m²
    const windPowerW = 0.5 * airDensity * area * Math.pow(windSpeed, 3); // Watts

    // Potência nominal de referência calculada na velocidade nominal (12 m/s)
    const ratedWindPowerW = 0.5 * airDensity * area * Math.pow(RATED_SPEED, 3);
    const eta = globalEfficiency / 100;
    const ratedElectricalW = ratedWindPowerW * cp * eta;

    let status = 'OPERAÇÃO NORMAL';
    let statusColor = '#53D68A';
    let mechanicalPowerW = 0;
    let electricalPowerW = 0;
    let rpm = 0;

    if (windSpeed < CUT_IN_SPEED) {
      status = 'ABAIXO DA VELOCIDADE DE PARTIDA (< 3 m/s)';
      statusColor = '#A7B7C9';
      mechanicalPowerW = 0;
      electricalPowerW = 0;
      rpm = 0;
    } else if (windSpeed > CUT_OUT_SPEED) {
      status = 'CORTE DE SEGURANÇA ATIVADO (> 25 m/s)';
      statusColor = '#F87171';
      mechanicalPowerW = 0;
      electricalPowerW = 0;
      rpm = 0;
    } else if (windSpeed >= RATED_SPEED) {
      status = 'POTÊNCIA NOMINAL (CONTROLE DE PASSO ATIVO)';
      statusColor = '#42D9F5';
      mechanicalPowerW = ratedWindPowerW * cp;
      electricalPowerW = ratedElectricalW;
      rpm = 16; // RPM nominal estabilizado pelo pitch
    } else {
      mechanicalPowerW = windPowerW * cp;
      electricalPowerW = mechanicalPowerW * eta;
      rpm = 4 + ((windSpeed - CUT_IN_SPEED) / (RATED_SPEED - CUT_IN_SPEED)) * 12;
    }

    const totalEfficiencyPct =
      windPowerW > 0 && electricalPowerW > 0
        ? (electricalPowerW / windPowerW) * 100
        : 0;

    return {
      area,
      windPowerKW: windPowerW / 1000,
      mechanicalPowerKW: mechanicalPowerW / 1000,
      electricalPowerKW: electricalPowerW / 1000,
      totalEfficiencyPct,
      status,
      statusColor,
      rpm: isRunning ? rpm : 0,
    };
  }, [windSpeed, bladeLength, airDensity, cp, globalEfficiency, isRunning]);

  // Dados dinâmicos para o gráfico de curva de potência (0 a 30 m/s)
  const powerCurveData = useMemo(() => {
    const area = Math.PI * Math.pow(bladeLength, 2);
    const eta = globalEfficiency / 100;
    const ratedWindPowerKW = (0.5 * airDensity * area * Math.pow(RATED_SPEED, 3)) / 1000;
    const ratedElecKW = ratedWindPowerKW * cp * eta;

    const rows = [];
    for (let v = 0; v <= 30; v += 1) {
      const pVentoKW = (0.5 * airDensity * area * Math.pow(v, 3)) / 1000;
      let pElecKW = 0;
      if (v >= CUT_IN_SPEED && v <= CUT_OUT_SPEED) {
        pElecKW = v >= RATED_SPEED ? ratedElecKW : pVentoKW * cp * eta;
      }
      rows.push({
        v,
        ventoKW: Math.round(pVentoKW),
        eletricaKW: Math.round(pElecKW),
      });
    }
    return rows;
  }, [bladeLength, airDensity, cp, globalEfficiency]);

  const formatPower = (kw) => {
    if (kw >= 1000) return `${(kw / 1000).toFixed(2)} MW`;
    return `${kw.toFixed(1)} kW`;
  };

  return (
    <div className="w-full h-full flex flex-col justify-center px-4 md:px-12 pt-16 pb-14 max-w-7xl mx-auto">
      {/* Cabeçalho + Botões de Controle */}
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div>
          <span className="text-xs font-bold tracking-widest uppercase text-[#42D9F5]">
            06 • Laboratório Virtual Interativo
          </span>
          <h2 className="text-xl sm:text-3xl font-bold text-[#F5F8FC]">
            Simulador Interativo de Usina Eólica
          </h2>
        </div>

        <div className="flex items-center gap-2">
          <button
            onClick={() => setIsRunning(true)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
              isRunning
                ? 'bg-[#53D68A] text-[#071426]'
                : 'bg-white/10 text-white hover:bg-white/20'
            }`}
          >
            <Play className="w-3.5 h-3.5" /> Iniciar
          </button>
          <button
            onClick={() => setIsRunning(false)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
              !isRunning
                ? 'bg-amber-400 text-[#071426]'
                : 'bg-white/10 text-white hover:bg-white/20'
            }`}
          >
            <Pause className="w-3.5 h-3.5" /> Pausar
          </button>
          <button
            onClick={handleReset}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#1479D4] hover:bg-[#1B88EB] text-white text-xs font-bold transition-all cursor-pointer"
          >
            <RotateCcw className="w-3.5 h-3.5" /> Reiniciar
          </button>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
        {/* COLUNA 1: CONTROLES DESLIZANTES */}
        <div className="lg:col-span-4 bg-[#0B1D36]/85 border border-white/10 rounded-2xl p-4 backdrop-blur-md flex flex-col justify-between space-y-3">
          {/* Slider 1: Velocidade do Vento */}
          <div>
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span className="text-[#F5F8FC]">Velocidade do Vento (v)</span>
              <span className="text-[#42D9F5] font-mono font-bold">{windSpeed.toFixed(1)} m/s</span>
            </div>
            <input
              type="range"
              min="0"
              max="30"
              step="0.5"
              value={windSpeed}
              onChange={(e) => setWindSpeed(parseFloat(e.target.value))}
              className="w-full accent-[#42D9F5] cursor-pointer"
            />
            <div className="flex justify-between text-[10px] text-[#A7B7C9]">
              <span>0 m/s</span>
              <span>Partida: 3</span>
              <span>Nominal: 12</span>
              <span>Corte: 25</span>
              <span>30</span>
            </div>
          </div>

          {/* Slider 2: Comprimento das Pás */}
          <div>
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span className="text-[#F5F8FC]">Comprimento das Pás (R)</span>
              <span className="text-[#42D9F5] font-mono font-bold">{bladeLength} m</span>
            </div>
            <input
              type="range"
              min="10"
              max="80"
              step="1"
              value={bladeLength}
              onChange={(e) => setBladeLength(parseInt(e.target.value, 10))}
              className="w-full accent-[#42D9F5] cursor-pointer"
            />
            <div className="flex justify-between text-[10px] text-[#A7B7C9]">
              <span>10 m (Pequeno porte)</span>
              <span>80 m (Grande porte)</span>
            </div>
          </div>

          {/* Slider 3: Densidade do Ar */}
          <div>
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span className="text-[#F5F8FC]">Densidade do Ar (ρ)</span>
              <span className="text-[#42D9F5] font-mono font-bold">{airDensity.toFixed(3)} kg/m³</span>
            </div>
            <input
              type="range"
              min="0.9"
              max="1.3"
              step="0.005"
              value={airDensity}
              onChange={(e) => setAirDensity(parseFloat(e.target.value))}
              className="w-full accent-[#42D9F5] cursor-pointer"
            />
            <div className="flex justify-between text-[10px] text-[#A7B7C9]">
              <span>0,90 (Altitude/Quente)</span>
              <span>1,225 (Nível do mar)</span>
              <span>1,30</span>
            </div>
          </div>

          {/* Slider 4: Coeficiente de Potência Cp */}
          <div>
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span className="text-[#F5F8FC]">Coeficiente Aerodinâmico (C<sub>p</sub>)</span>
              <span className="text-[#53D68A] font-mono font-bold">
                {cp.toFixed(3)} {cp >= 0.593 ? '(Limite de Betz)' : ''}
              </span>
            </div>
            <input
              type="range"
              min="0.1"
              max="0.593"
              step="0.003"
              value={cp}
              onChange={(e) => setCp(Math.min(0.593, parseFloat(e.target.value)))}
              className="w-full accent-[#53D68A] cursor-pointer"
            />
            <div className="text-[10px] text-[#A7B7C9]">
              Máximo físico teórico = 0,593 (16/27). Na prática depende do projeto e operação.
            </div>
          </div>

          {/* Slider 5: Eficiência Eletromecânica η */}
          <div>
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span className="text-[#F5F8FC]">Eficiência Eletromecânica (η)</span>
              <span className="text-[#42D9F5] font-mono font-bold">{globalEfficiency}%</span>
            </div>
            <input
              type="range"
              min="0"
              max="100"
              step="1"
              value={globalEfficiency}
              onChange={(e) => setGlobalEfficiency(parseInt(e.target.value, 10))}
              className="w-full accent-[#42D9F5] cursor-pointer"
            />
            <div className="text-[10px] text-[#A7B7C9]">
              Fórmula: P<sub>elétrica</sub> = P<sub>vento</sub> · C<sub>p</sub> · η (Parâmetros ilustrativos)
            </div>
          </div>
        </div>

        {/* COLUNA 2: VISUALIZAÇÃO ANIMADA DA TURBINA E STATUS */}
        <div className="lg:col-span-4 bg-[#0B1D36]/85 border border-white/10 rounded-2xl p-4 backdrop-blur-md flex flex-col justify-between">
          <div className="flex items-center justify-between gap-2 mb-2">
            <span
              style={{ color: physics.statusColor, borderColor: `${physics.statusColor}55` }}
              className="px-2.5 py-1 rounded-full text-[11px] font-bold border bg-[#071426]/90 truncate"
            >
              ● {physics.status}
            </span>
          </div>

          {/* Cena SVG da Turbina e Rede */}
          <div className="relative w-full h-56 rounded-xl bg-gradient-to-b from-[#071426] via-[#0B2240] to-[#0E2E52] border border-white/10 overflow-hidden">
            <svg viewBox="0 0 320 230" className="w-full h-full">
              {/* Solo */}
              <rect x="0" y="205" width="320" height="25" fill="#091C34" />

              {/* Linhas de Vento dinâmicas */}
              {isRunning && windSpeed > 0 && (
                <g opacity={Math.min(0.9, 0.2 + windSpeed / 30)}>
                  <line x1="12" y1="45" x2="85" y2="45" stroke="#42D9F5" strokeWidth="1.8" strokeDasharray="10 6" />
                  <line x1="8" y1="85" x2="90" y2="85" stroke="#42D9F5" strokeWidth="2.2" strokeDasharray="12 6" />
                  <line x1="18" y1="125" x2="80" y2="125" stroke="#42D9F5" strokeWidth="1.6" strokeDasharray="8 6" />
                </g>
              )}

              {/* Turbina com escala de pás proporcional a bladeLength */}
              <AnimatedTurbineSVG
                x={125}
                y={62}
                scale={0.95}
                rpm={physics.rpm}
                bladeLengthFactor={0.45 + (bladeLength / 80) * 0.65}
              />

              {/* Cabo de energia até a casa */}
              <path
                d="M 125,205 L 255,205 L 255,188"
                stroke={physics.electricalPowerKW > 0 ? '#53D68A' : '#334155'}
                strokeWidth="3"
                strokeDasharray={physics.electricalPowerKW > 0 ? '6 4' : 'none'}
                fill="none"
              />

              {/* Casa receptora */}
              <g transform="translate(232, 152)">
                <polygon points="23,0 0,18 46,18" fill="#1E3A5F" />
                <rect x="6" y="18" width="34" height="24" fill="#0F294A" stroke="#42D9F5" strokeWidth="1" />
                <rect
                  x="17"
                  y="24"
                  width="12"
                  height="10"
                  fill={physics.electricalPowerKW > 0 ? '#FDE047' : '#334155'}
                />
              </g>
            </svg>

            {/* Indicador de Rotação no canto */}
            <div className="absolute top-2.5 right-2.5 px-2.5 py-1 rounded-lg bg-[#071426]/85 border border-white/10 text-xs font-mono text-[#42D9F5]">
              {physics.rpm.toFixed(1)} RPM
            </div>
          </div>

          {/* Grade de 6 Resultados em Tempo Real */}
          <div className="grid grid-cols-2 gap-2 mt-3">
            <div className="p-2.5 rounded-xl bg-[#071426]/85 border border-white/10">
              <div className="text-[10px] text-[#A7B7C9]">Área Varrida (A = π·R²)</div>
              <div className="text-sm font-bold text-[#F5F8FC] font-mono">
                {Math.round(physics.area).toLocaleString('pt-BR')} m²
              </div>
            </div>
            <div className="p-2.5 rounded-xl bg-[#071426]/85 border border-white/10">
              <div className="text-[10px] text-[#A7B7C9]">Eficiência Global (C<sub>p</sub>·η)</div>
              <div className="text-sm font-bold text-[#42D9F5] font-mono">
                {physics.totalEfficiencyPct.toFixed(1)}%
              </div>
            </div>
            <div className="p-2.5 rounded-xl bg-[#071426]/85 border border-white/10">
              <div className="text-[10px] text-[#A7B7C9]">Potência no Vento</div>
              <div className="text-sm font-bold text-[#F5F8FC] font-mono">
                {formatPower(physics.windPowerKW)}
              </div>
            </div>
            <div className="p-2.5 rounded-xl bg-[#071426]/85 border border-white/10">
              <div className="text-[10px] text-[#A7B7C9]">Potência Mecânica</div>
              <div className="text-sm font-bold text-[#42D9F5] font-mono">
                {formatPower(physics.mechanicalPowerKW)}
              </div>
            </div>
            <div className="col-span-2 p-3 rounded-xl bg-gradient-to-r from-[#53D68A]/20 to-[#1479D4]/20 border border-[#53D68A]/50 flex items-center justify-between">
              <div>
                <div className="text-[11px] font-bold uppercase text-[#53D68A]">
                  Potência Elétrica Estimada
                </div>
                <div className="text-[10px] text-[#A7B7C9]">
                  Vento: {windSpeed} m/s • R: {bladeLength} m
                </div>
              </div>
              <div className="text-xl sm:text-2xl font-extrabold text-[#53D68A] font-mono">
                {formatPower(physics.electricalPowerKW)}
              </div>
            </div>
          </div>
        </div>

        {/* COLUNA 3: GRÁFICO DINÂMICO DE POTÊNCIA */}
        <div className="lg:col-span-4 bg-[#0B1D36]/85 border border-white/10 rounded-2xl p-4 backdrop-blur-md flex flex-col justify-between">
          <div>
            <h3 className="text-sm font-bold text-[#F5F8FC]">
              Curva Dinâmica de Potência
            </h3>
            <p className="text-[11px] text-[#A7B7C9]">
              Comparação entre potência cúbica disponível no vento e curva elétrica operacional da turbina.
            </p>
          </div>

          <div className="w-full h-60 my-2">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={powerCurveData} margin={{ top: 10, right: 12, left: -12, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.08)" />
                <XAxis dataKey="v" stroke="#A7B7C9" tick={{ fontSize: 10 }} unit="m/s" />
                <YAxis
                  stroke="#A7B7C9"
                  tick={{ fontSize: 10 }}
                  tickFormatter={(val) => (val >= 1000 ? `${(val / 1000).toFixed(0)}MW` : `${val}k`)}
                />
                <RechartsTooltip
                  contentStyle={{
                    backgroundColor: '#071426',
                    borderColor: '#42D9F5',
                    borderRadius: '8px',
                    fontSize: '11px',
                  }}
                  formatter={(val, name) => [
                    formatPower(Number(val)),
                    name === 'ventoKW' ? 'Potência no Vento' : 'Potência Elétrica',
                  ]}
                  labelFormatter={(l) => `Vento: ${l} m/s`}
                />
                <Legend wrapperStyle={{ fontSize: '11px' }} />
                <Line
                  type="monotone"
                  dataKey="ventoKW"
                  name="Vento (Cúbica)"
                  stroke="#42D9F5"
                  strokeWidth={2}
                  strokeDasharray="4 4"
                  dot={false}
                />
                <Line
                  type="monotone"
                  dataKey="eletricaKW"
                  name="Elétrica Estimada"
                  stroke="#53D68A"
                  strokeWidth={2.5}
                  dot={false}
                />
                <ReferenceLine x={windSpeed} stroke="#F5F8FC" strokeDasharray="3 3" />
                <ReferenceDot
                  x={windSpeed}
                  y={Math.round(physics.electricalPowerKW)}
                  r={5}
                  fill="#53D68A"
                  stroke="#FFFFFF"
                />
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div className="p-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-[11px] text-[#A7B7C9] leading-snug">
            Observe como entre <strong className="text-white">3 e 12 m/s</strong> a geração cresce rapidamente, estabiliza na potência nominal e zera acima de <strong className="text-red-300">25 m/s</strong> por segurança estrutural.
          </div>
        </div>
      </div>
    </div>
  );
};

// ============================================================================
// SLIDE 07 — O LIMITE DE BETZ
// ============================================================================
const Slide07Betz = () => {
  const [extractionMode, setExtractionMode] = useState('ideal'); // 'low' | 'ideal' | 'blocked'

  const modeConfig = {
    low: {
      label: 'Baixa Extração (Cp ≈ 0,25)',
      vBefore: '12,0 m/s',
      vAfter: '9,8 m/s',
      expansion: 14,
      desc: 'O ar passa quase sem desacelerar pela turbina; grande parte da energia cinética continua no escoamento sem ser aproveitada.',
    },
    ideal: {
      label: 'Limite de Betz (Cp = 16/27 ≈ 59,3%)',
      vBefore: '12,0 m/s',
      vAfter: '4,0 m/s (1/3 de v₁)',
      expansion: 34,
      desc: 'Máximo teórico demonstrado por Albert Betz (1919): ocorre quando a velocidade do vento após o rotor reduz para 1/3 da velocidade inicial. A seção do tubo de ar expande para conservar a massa (Q = A·v).',
    },
    blocked: {
      label: 'Bloqueio Total (Impossível: Cp = 0)',
      vBefore: '12,0 m/s',
      vAfter: '0 m/s (Ar parado)',
      expansion: 58,
      desc: 'Se o rotor extraísse 100% da energia, a velocidade final seria zero. O ar ficaria estagnado atrás das pás, bloqueando a entrada de novo ar e impedindo o funcionamento da turbina.',
    },
  }[extractionMode];

  return (
    <div className="w-full h-full flex flex-col justify-center px-5 md:px-14 pt-16 pb-14 max-w-7xl mx-auto">
      <div className="mb-3">
        <span className="text-xs font-bold tracking-widest uppercase text-[#42D9F5]">
          07 • Limite Termodinâmico e Aerodinâmico
        </span>
        <h2 className="text-2xl sm:text-4xl font-bold text-[#F5F8FC] mt-0.5">
          O Limite de Betz
        </h2>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
        {/* Explicação Científica */}
        <div className="lg:col-span-5 flex flex-col justify-between bg-[#0B1D36]/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md space-y-3">
          <div className="p-4 rounded-xl bg-gradient-to-r from-[#1479D4]/25 to-[#42D9F5]/15 border border-[#42D9F5]/40 text-center">
            <div className="text-xs uppercase tracking-widest text-[#42D9F5] font-bold">
              Coeficiente Máximo Teórico
            </div>
            <div className="text-2xl sm:text-3xl font-extrabold text-white font-mono mt-1">
              C<sub>p máx</sub> = 16 / 27 ≈ 59,3%
            </div>
          </div>

          <div className="space-y-2.5 text-xs sm:text-sm text-[#F5F8FC]/90 leading-relaxed">
            <p>
              <strong className="text-[#42D9F5]">Por que o ar não pode parar?</strong> Pela lei da conservação da massa (equação da continuidade), todo o ar que entra no rotor precisa sair pelo outro lado. Se a velocidade após a turbina caísse a zero, o ar se acumularia e desviaria ao redor da turbina.
            </p>
            <p>
              <strong className="text-[#53D68A]">Turbinas Reais vs. Limite Teórico:</strong> Aerogeradores comerciais modernos atingem coeficientes de potência entre <strong className="text-white">35% e 48%</strong> (cerca de 70% a 80% do limite de Betz), devido ao arrasto aerodinâmico das pás, vórtices de ponta e perda de esteira rotacional.
            </p>
          </div>

          <div className="p-3 rounded-xl bg-[#071426]/80 border border-white/10 text-xs text-[#A7B7C9]">
            <strong className="text-white">Princípio Físico:</strong> Para desacelerar o ar sem interromper o fluxo, a área da coluna de ar expande após cruzar o rotor (A₂ &gt; A₁).
          </div>
        </div>

        {/* Simulação Visual do Tubo de Corrente (Streamtube) */}
        <div className="lg:col-span-7 flex flex-col justify-between bg-[#0B1D36]/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <span className="text-xs font-bold uppercase tracking-wider text-[#F5F8FC]">
              Escoamento Antes, Durante e Depois do Rotor
            </span>
            <div className="flex flex-wrap gap-1.5">
              {[
                { id: 'low', label: 'Pouca Extração' },
                { id: 'ideal', label: 'Limite de Betz (59,3%)' },
                { id: 'blocked', label: 'Bloqueio (0%)' },
              ].map((btn) => (
                <button
                  key={btn.id}
                  onClick={() => setExtractionMode(btn.id)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                    extractionMode === btn.id
                      ? 'bg-[#42D9F5] text-[#071426]'
                      : 'bg-white/10 text-[#A7B7C9] hover:text-white'
                  }`}
                >
                  {btn.label}
                </button>
              ))}
            </div>
          </div>

          {/* Diagrama SVG do Tubo de Corrente */}
          <div className="w-full h-56 rounded-xl bg-[#071426] border border-white/10 p-2 overflow-hidden">
            <svg viewBox="0 0 600 220" className="w-full h-full">
              {/* Zonas verticais */}
              <line x1="290" y1="15" x2="290" y2="205" stroke="rgba(255,255,255,0.12)" strokeDasharray="4 4" />

              {/* Tubo de corrente expandindo */}
              <path
                d={`M 40,75 Q 180,75 290,${75 - modeConfig.expansion * 0.45} Q 420,${75 - modeConfig.expansion} 560,${75 - modeConfig.expansion}`}
                fill="none"
                stroke="#42D9F5"
                strokeWidth="2.5"
              />
              <path
                d={`M 40,145 Q 180,145 290,${145 + modeConfig.expansion * 0.45} Q 420,${145 + modeConfig.expansion} 560,${145 + modeConfig.expansion}`}
                fill="none"
                stroke="#42D9F5"
                strokeWidth="2.5"
              />

              {/* Linhas de fluxo internas */}
              <path
                d={`M 40,98 Q 180,98 290,${98 - modeConfig.expansion * 0.18} Q 420,${98 - modeConfig.expansion * 0.4} 560,${98 - modeConfig.expansion * 0.4}`}
                fill="none"
                stroke="#53D68A"
                strokeWidth="1.6"
                strokeDasharray="10 6"
              />
              <path
                d={`M 40,122 Q 180,122 290,${122 + modeConfig.expansion * 0.18} Q 420,${122 + modeConfig.expansion * 0.4} 560,${122 + modeConfig.expansion * 0.4}`}
                fill="none"
                stroke="#53D68A"
                strokeWidth="1.6"
                strokeDasharray="10 6"
              />

              {/* Plano do Rotor */}
              <rect x="286" y="55" width="8" height="110" rx="4" fill="#F8FAFC" stroke="#42D9F5" strokeWidth="1.5" />
              <rect x="292" y="106" width="18" height="8" rx="2" fill="#94A3B8" />
              <polygon points="297,114 305,114 308,200 294,200" fill="#334155" />

              {/* Rótulos das 3 regiões */}
              <text x="120" y="30" fill="#42D9F5" fontSize="11" fontWeight="bold" textAnchor="middle">

const Slide12Quiz = () => {
  const [qIndex, setQIndex] = useState(0);
  const [selectedOption, setSelectedOption] = useState(null);
  const [score, setScore] = useState(0);
  const [finished, setFinished] = useState(false);

  const currentQ = QUIZ_QUESTIONS[qIndex];
  const hasAnswered = selectedOption !== null;

  const handleSelect = (optIdx) => {
    if (hasAnswered) return;
    setSelectedOption(optIdx);
    if (optIdx === currentQ.correct) {
      setScore((s) => s + 1);
    }
  };

  const handleNext = () => {
    if (qIndex + 1 < QUIZ_QUESTIONS.length) {
      setQIndex((i) => i + 1);
      setSelectedOption(null);
    } else {
      setFinished(true);
    }
  };

  const handleRestart = () => {
    setQIndex(0);
    setSelectedOption(null);
    setScore(0);
    setFinished(false);
  };

  const percentage = Math.round((score / QUIZ_QUESTIONS.length) * 100);

  return (
    <div className="w-full h-full flex flex-col justify-center px-5 md:px-14 pt-16 pb-14 max-w-4xl mx-auto">
      <div className="mb-3 flex items-center justify-between">
        <div>
          <span className="text-xs font-bold tracking-widest uppercase text-[#42D9F5]">
            12 • Avaliação de Aprendizagem
          </span>
          <h2 className="text-2xl sm:text-3xl font-bold text-[#F5F8FC]">
            Teste seus Conhecimentos
          </h2>
        </div>

        <div className="px-3.5 py-1.5 rounded-xl bg-[#0B1D36] border border-[#42D9F5]/40 text-xs sm:text-sm font-bold text-[#42D9F5]">
          Pontuação: {score} / {QUIZ_QUESTIONS.length}
        </div>
      </div>

      {!finished ? (
        <div className="bg-[#0B1D36]/85 border border-white/10 rounded-2xl p-5 sm:p-6 backdrop-blur-md shadow-xl space-y-4">
          {/* Progresso do Quiz */}
          <div className="flex items-center justify-between text-xs text-[#A7B7C9]">
            <span>
              Questão <strong className="text-white">{qIndex + 1}</strong> de {QUIZ_QUESTIONS.length}
            </span>
            <span>{Math.round(((qIndex + 1) / QUIZ_QUESTIONS.length) * 100)}% concluído</span>
          </div>
          <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-[#1479D4] to-[#42D9F5] transition-all duration-300"
              style={{ width: `${((qIndex + 1) / QUIZ_QUESTIONS.length) * 100}%` }}
            />
          </div>

          <h3 className="text-base sm:text-xl font-bold text-[#F5F8FC] leading-snug">
            {currentQ.q}
          </h3>

          <div className="space-y-2.5">
            {currentQ.options.map((opt, idx) => {
              let btnStyle =
                'bg-[#071426]/80 border-white/15 text-[#F5F8FC] hover:border-[#42D9F5]/60 hover:bg-[#1479D4]/15';

              if (hasAnswered) {
                if (idx === currentQ.correct) {
                  btnStyle = 'bg-[#53D68A]/20 border-[#53D68A] text-white font-semibold';
                } else if (idx === selectedOption) {
                  btnStyle = 'bg-red-500/20 border-red-400 text-red-200';
                } else {
                  btnStyle = 'bg-[#071426]/50 border-white/10 text-[#A7B7C9]/60';
                }
              }

              return (
                <button
                  key={idx}
                  onClick={() => handleSelect(idx)}
                  disabled={hasAnswered}
                  className={`w-full p-3.5 rounded-xl border text-left text-xs sm:text-sm transition-all flex items-center justify-between gap-3 cursor-pointer ${btnStyle}`}
                >
                  <span>
                    <strong className="text-[#42D9F5] mr-2">
                      {String.fromCharCode(65 + idx)})
                    </strong>
                    {opt}
                  </span>
                  {hasAnswered && idx === currentQ.correct && (
                    <CheckCircle2 className="w-5 h-5 text-[#53D68A] shrink-0" />
                  )}
                  {hasAnswered && idx === selectedOption && idx !== currentQ.correct && (
                    <XCircle className="w-5 h-5 text-red-400 shrink-0" />
                  )}
                </button>
              );
            })}
          </div>

          {/* Feedback Científico após responder */}
          {hasAnswered && (
            <div
              className={`p-3.5 rounded-xl border text-xs sm:text-sm leading-relaxed ${
                selectedOption === currentQ.correct
                  ? 'bg-[#53D68A]/15 border-[#53D68A]/50 text-[#F5F8FC]'
                  : 'bg-amber-400/15 border-amber-400/50 text-[#F5F8FC]'
              }`}
            >
              <div className="font-bold mb-1">
                {selectedOption === currentQ.correct
                  ? '✓ Resposta Correta!'
                  : '✕ Resposta Incorreta — Veja a explicação científica:'}
              </div>
              <p className="text-[#F5F8FC]/90">{currentQ.explanation}</p>
            </div>
          )}

          {hasAnswered && (
            <div className="flex justify-end pt-1">
              <button
                onClick={handleNext}
                className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#1479D4] to-[#42D9F5] text-[#071426] font-extrabold text-xs sm:text-sm cursor-pointer shadow-lg hover:opacity-95"
              >
                {qIndex + 1 < QUIZ_QUESTIONS.length ? 'Próxima Questão →' : 'Ver Resultado Final →'}
              </button>
            </div>
          )}
        </div>
      ) : (
        /* Tela Final de Resultado */
        <div className="bg-[#0B1D36]/90 border border-[#42D9F5]/40 rounded-2xl p-6 sm:p-8 backdrop-blur-md text-center space-y-5">
          <div className="w-16 h-16 rounded-2xl bg-[#53D68A]/20 border border-[#53D68A] flex items-center justify-center mx-auto text-[#53D68A]">
            <Award className="w-9 h-9" />
          </div>

          <div>
            <h3 className="text-2xl sm:text-3xl font-extrabold text-[#F5F8FC]">
              Resultado da Avaliação Científica
            </h3>
            <p className="text-sm text-[#A7B7C9] mt-1">
              Você acertou <strong className="text-[#53D68A]">{score}</strong> de{' '}
              <strong className="text-white">{QUIZ_QUESTIONS.length}</strong> questões ({percentage}%)
            </p>
          </div>

          <div className="max-w-lg mx-auto p-4 rounded-xl bg-[#071426]/80 border border-white/10 text-xs sm:text-sm text-[#F5F8FC]">
            {percentage >= 80
              ? 'Excelente domínio científico! Você compreendeu profundamente a física dos ventos, a aerodinâmica, o limite de Betz e a geração eletromagnética.'
              : percentage >= 50
              ? 'Bom desempenho! Você domina os conceitos fundamentais e pode revisar o simulador e os diagramas para atingir a pontuação máxima.'
              : 'Continue explorando a apresentação e o simulador interativo para consolidar os princípios físicos das usinas eólicas!'}
          </div>

          <button
            onClick={handleRestart}
            className="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-[#1479D4] hover:bg-[#1B88EB] text-white font-bold text-sm cursor-pointer transition-all"
          >
            <RotateCcw className="w-4 h-4" /> Refazer o Quiz
          </button>
        </div>
      )}
    </div>
  );
};

// ============================================================================
// SLIDE 13 — CONCLUSÃO
// ============================================================================
const Slide13Conclusion = ({ onRestartPresentation, onGoToSimulator }) => {
  return (
    <div className="relative w-full h-full flex flex-col justify-between overflow-hidden px-6 md:px-16 pt-20 pb-14">
      {/* Gradiente cinematográfico de pôr do sol no horizonte */}
      <div
        className="absolute inset-0 pointer-events-none opacity-65"
        style={{
          background:
            'radial-gradient(ellipse at 50% 82%, rgba(245, 158, 11, 0.34) 0%, rgba(20, 121, 212, 0.22) 42%, rgba(7, 20, 38, 0.95) 80%)',
        }}
      />

      <div className="relative z-10 max-w-4xl mx-auto text-center my-auto space-y-6">
        <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#53D68A]/15 border border-[#53D68A]/40 text-[#53D68A] text-xs font-bold uppercase tracking-widest">
          <Sparkles className="w-4 h-4" /> Síntese Científica • Futuro Sustentável
        </div>

        <h1 className="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-[#F5F8FC] leading-tight">
          O VENTO É MOVIMENTO.
          <br />
          <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#42D9F5] via-[#53D68A] to-amber-300">
            O MOVIMENTO É ENERGIA.
          </span>
        </h1>

        <p className="text-sm sm:text-base md:text-lg text-[#F5F8FC]/90 max-w-3xl mx-auto leading-relaxed bg-[#071426]/65 p-5 rounded-2xl border border-white/10 backdrop-blur-md">
          “As usinas eólicas demonstram como os princípios da Física podem ser utilizados para transformar um fenômeno natural em eletricidade. Por meio da aerodinâmica, da mecânica e do eletromagnetismo, a energia cinética do vento é convertida em energia elétrica, contribuindo para uma matriz energética mais sustentável.”
        </p>

        <div className="flex flex-wrap items-center justify-center gap-4 pt-2">
          <button
            onClick={onRestartPresentation}
            className="inline-flex items-center gap-2 px-6 py-3.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/25 text-[#F5F8FC] font-bold text-sm transition-all cursor-pointer backdrop-blur-md"
          >
            <RotateCcw className="w-4 h-4 text-[#42D9F5]" />
            REVER APRESENTAÇÃO
          </button>

          <button
            onClick={onGoToSimulator}
            className="inline-flex items-center gap-2 px-7 py-3.5 rounded-xl bg-gradient-to-r from-[#1479D4] to-[#53D68A] text-[#071426] font-extrabold text-sm shadow-[0_0_28px_rgba(83,214,138,0.45)] hover:scale-105 transition-all cursor-pointer"
          >
            <Sliders className="w-4 h-4" />
            EXPLORAR O SIMULADOR
          </button>
        </div>
      </div>

      {/* Silhueta Panorâmica de Parque Eólico ao Pôr do Sol */}
      <div className="relative z-10 w-full max-w-6xl mx-auto h-40 sm:h-48 pointer-events-none">
        <svg viewBox="0 0 1200 220" className="w-full h-full overflow-visible">
          {/* Sol no horizonte */}
          <circle cx="600" cy="175" r="78" fill="rgba(251, 191, 36, 0.25)" />
          <circle cx="600" cy="175" r="46" fill="rgba(253, 224, 71, 0.45)" />

          {/* Horizonte montanhoso */}
          <path
            d="M-50,220 L-50,165 Q300,135 600,168 T1250,155 L1250,220 Z"
            fill="#071426"
          />

          {/* Aerogeradores girando no horizonte */}
          <AnimatedTurbineSVG x={220} y={40} scale={0.78} rpm={12} glowColor="#FBBF24" />
          <AnimatedTurbineSVG x={430} y={52} scale={0.68} rpm={11} glowColor="#FBBF24" />
          <AnimatedTurbineSVG x={770} y={48} scale={0.72} rpm={13} glowColor="#FBBF24" />
          <AnimatedTurbineSVG x={980} y={36} scale={0.82} rpm={12} glowColor="#FBBF24" />
        </svg>
      </div>
    </div>
  );
};

// ============================================================================
// APLICAÇÃO PRINCIPAL — CONTROLADOR DE SLIDES E NAVEGAÇÃO
// ============================================================================
    function App() {
  const [currentSlide, setCurrentSlide] = useState(0); // 0 a 12 (13 slides)
  const [menuOpen, setMenuOpen] = useState(false);
  const wheelLockRef = useRef(false);
  const touchStartYRef = useRef(null);
  const slideContainerRef = useRef(null);

  const totalSlides = SLIDES_META.length;

  const goToSlide = useCallback(
    (index) => {
      const clamped = Math.max(0, Math.min(totalSlides - 1, index));
      setCurrentSlide(clamped);
      setMenuOpen(false);
      if (slideContainerRef.current) {
        slideContainerRef.current.scrollTop = 0;
      }
    },
    [totalSlides]
  );

  const nextSlide = useCallback(() => goToSlide(currentSlide + 1), [currentSlide, goToSlide]);
  const prevSlide = useCallback(() => goToSlide(currentSlide - 1), [currentSlide, goToSlide]);

  // Navegação por teclado (Setas)
  useEffect(() => {
    const handleKeyDown = (e) => {
      // Evita trocar de slide enquanto o usuário ajusta um slider com as setas
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [nextSlide, prevSlide]);

  // Navegação controlada por rolagem vertical (Wheel) quando no topo/base do slide
  const handleWheel = (e) => {
    if (wheelLockRef.current) return;
    const el = slideContainerRef.current;
    if (!el) return;

    const atTop = el.scrollTop <= 2;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;

    if (e.deltaY > 45 && atBottom && currentSlide < totalSlides - 1) {
      wheelLockRef.current = true;
      nextSlide();
      setTimeout(() => {
        wheelLockRef.current = false;
      }, 650);
    } else if (e.deltaY < -45 && atTop && currentSlide > 0) {
      wheelLockRef.current = true;
      prevSlide();
      setTimeout(() => {
        wheelLockRef.current = false;
      }, 650);
    }
  };

  // Gestos de toque (Swipe vertical suave em dispositivos móveis)
  const handleTouchStart = (e) => {
    if (e.target.tagName === 'INPUT') return;
    touchStartYRef.current = e.touches[0].clientY;
  };

  const handleTouchEnd = (e) => {
    if (touchStartYRef.current === null) return;
    const deltaY = touchStartYRef.current - e.changedTouches[0].clientY;
    touchStartYRef.current = null;

    const el = slideContainerRef.current;
    if (!el) return;
    const atTop = el.scrollTop <= 2;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;

    if (deltaY > 70 && atBottom && currentSlide < totalSlides - 1) {
      nextSlide();
    } else if (deltaY < -70 && atTop && currentSlide > 0) {
      prevSlide();
    }
  };

  const progressPct = ((currentSlide + 1) / totalSlides) * 100;

  return (
    <div
      onWheel={handleWheel}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
      className="relative w-screen h-screen overflow-hidden bg-[#071426] text-[#F5F8FC] font-sans select-none"
    >
      {/* Keyframes globais para rotação suave das turbinas e gradientes compartilhados */}
      <style>{`
        @keyframes spinTurbine {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes fadeSlideIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .slide-animate {
          animation: fadeSlideIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
      `}</style>

      {/* Definições SVG globais compartilhadas */}
      <svg width="0" height="0" className="absolute">
        <defs>
          <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#CBD5E1" />
            <stop offset="50%" stopColor="#F8FAFC" />
            <stop offset="100%" stopColor="#94A3B8" />
          </linearGradient>
          <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#FFFFFF" />
            <stop offset="100%" stopColor="#CBD5E1" />
          </linearGradient>
        </defs>
      </svg>

      {/* Fundo Dinâmico de Partículas de Vento */}
      <WindCanvasBackground
        speedMultiplier={currentSlide === 5 ? 1.5 : 1}
        warmSunset={currentSlide === 12}
      />

      {/* BARRA SUPERIOR FIXA + BARRA DE PROGRESSO */}
      <header className="fixed top-0 left-0 right-0 z-40 bg-[#071426]/80 backdrop-blur-md border-b border-white/10">
        {/* Linha de Progresso */}
        <div className="w-full h-1 bg-white/10">
          <div
            className="h-full bg-gradient-to-r from-[#1479D4] via-[#42D9F5] to-[#53D68A] transition-all duration-300"
            style={{ width: `${progressPct}%` }}
          />
        </div>

        <div className="max-w-7xl mx-auto px-4 md:px-8 h-12 flex items-center justify-between gap-3">
          {/* Logo / Identidade */}
          <button
            onClick={() => goToSlide(0)}
            className="flex items-center gap-2 text-left cursor-pointer group"
          >
            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-[#1479D4] to-[#42D9F5] flex items-center justify-center text-[#071426]">
              <Wind className="w-4 h-4" />
            </div>
            <span className="font-extrabold text-xs sm:text-sm tracking-wide text-[#F5F8FC] group-hover:text-[#42D9F5] transition-colors">
              USINAS EÓLICAS
            </span>
          </button>

          {/* Navegação Rápida Desktop (Pílulas dos 13 slides) */}
          <nav className="hidden xl:flex items-center gap-1">
            {SLIDES_META.map((s, idx) => {
              const active = idx === currentSlide;
              return (
                <button
                  key={s.id}
                  onClick={() => goToSlide(idx)}
                  className={`px-2 py-1 rounded-md text-[11px] font-semibold transition-all cursor-pointer ${
                    active
                      ? 'bg-[#42D9F5] text-[#071426] font-bold'
                      : 'text-[#A7B7C9] hover:text-white hover:bg-white/10'
                  }`}
                >
                  {String(s.id).padStart(2, '0')}. {s.short}
                </button>
              );
            })}
          </nav>

          {/* Contador + Botão do Índice Completo */}
          <div className="flex items-center gap-2.5">
            <span className="px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 font-mono text-xs font-bold text-[#42D9F5]">
              {String(currentSlide + 1).padStart(2, '0')} / {String(totalSlides).padStart(2, '0')}
            </span>

            <button
              onClick={() => setMenuOpen((o) => !o)}
              className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-[#1479D4]/25 hover:bg-[#1479D4]/40 border border-[#42D9F5]/40 text-xs font-semibold text-[#F5F8FC] cursor-pointer"
              aria-label="Abrir índice de slides"
            >
              {menuOpen ? <X className="w-4 h-4" /> : <Menu className="w-4 h-4" />}
              <span className="hidden sm:inline">Slides</span>
            </button>
          </div>
        </div>
      </header>

      {/* DRAWER DO ÍNDICE DE NAVEGAÇÃO (13 SLIDES) */}
      {menuOpen && (
        <div className="fixed inset-0 z-50 bg-[#071426]/80 backdrop-blur-md flex justify-end">
          <div className="w-full max-w-sm bg-[#0B1D36] border-l border-[#42D9F5]/30 h-full p-5 flex flex-col justify-between overflow-y-auto">
            <div>
              <div className="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
                <span className="text-sm font-bold text-[#42D9F5] uppercase tracking-wider">
                  Índice da Apresentação
                </span>
                <button
                  onClick={() => setMenuOpen(false)}
                  className="p-1.5 rounded-lg bg-white/10 text-white cursor-pointer"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>

              <div className="space-y-1.5">
                {SLIDES_META.map((s, idx) => {
                  const active = idx === currentSlide;
                  return (
                    <button
                      key={s.id}
                      onClick={() => goToSlide(idx)}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left text-xs sm:text-sm transition-all cursor-pointer border ${
                        active
                          ? 'bg-[#1479D4] text-white border-[#42D9F5] font-bold'
                          : 'bg-white/5 text-[#A7B7C9] border-transparent hover:bg-white/10 hover:text-white'
                      }`}
                    >
                      <span className="font-mono text-xs font-bold text-[#42D9F5]">
                        {String(s.id).padStart(2, '0')}
                      </span>
                      <span className="truncate">{s.title}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="pt-4 mt-4 border-t border-white/10 text-[11px] text-[#A7B7C9]">
              Dica: Use as setas ← e → do teclado ou role entre as telas para navegar.
            </div>
          </div>
        </div>
      )}

      {/* ÁREA PRINCIPAL DO SLIDE ATIVO */}
      <main
        ref={slideContainerRef}
        key={currentSlide}
        className="relative z-10 w-full h-full overflow-y-auto slide-animate"
      >
        {currentSlide === 0 && <Slide01Cover onExplore={() => goToSlide(1)} />}
        {currentSlide === 1 && <Slide02Concept />}
        {currentSlide === 2 && <Slide03Physics />}
        {currentSlide === 3 && <Slide04HowItWorks />}
        {currentSlide === 4 && <Slide05Parts />}
        {currentSlide === 5 && <Slide06Simulator />}
        {currentSlide === 6 && <Slide07Betz />}
        {currentSlide === 7 && <Slide08Types />}
        {currentSlide === 8 && <Slide09ProsCons />}
        {currentSlide === 9 && <Slide10Brazil />}
        {currentSlide === 10 && <Slide11Journey />}
        {currentSlide === 11 && <Slide12Quiz />}
        {currentSlide === 12 && (
          <Slide13Conclusion
            onRestartPresentation={() => goToSlide(0)}
            onGoToSimulator={() => goToSlide(5)}
          />
        )}
      </main>

      {/* RODAPÉ FIXO DE NAVEGAÇÃO ENTRE SLIDES */}
      <footer className="fixed bottom-0 left-0 right-0 z-40 bg-[#071426]/80 backdrop-blur-md border-t border-white/10 h-12 px-4 md:px-8 flex items-center justify-between">
        <button
          onClick={prevSlide}
          disabled={currentSlide === 0}
          className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 disabled:opacity-30 text-xs font-bold text-[#F5F8FC] transition-all cursor-pointer"
        >
          <ChevronLeft className="w-4 h-4" />
          <span>Anterior</span>
        </button>

        {/* Indicadores de Bolinhas (Dots) */}
        <div className="flex items-center gap-1.5">
          {SLIDES_META.map((s, idx) => (
            <button
              key={s.id}
              onClick={() => goToSlide(idx)}
              title={`Slide ${s.id}: ${s.title}`}
              className={`h-2 rounded-full transition-all cursor-pointer ${
                idx === currentSlide
                  ? 'w-6 bg-[#42D9F5]'
                  : 'w-2 bg-white/25 hover:bg-white/50'
              }`}
            />
          ))}
        </div>

<button
  onClick={nextSlide}
  disabled={currentSlide === totalSlides - 1}
  className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#1479D4] hover:bg-[#1B88EB] disabled:opacity-30 text-xs font-bold text-white transition-all cursor-pointer"
>
  <span>Avançar</span>
  <ChevronRight className="w-4 h-4" />
</button>
</footer>
</div>
);
}



    // ========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
